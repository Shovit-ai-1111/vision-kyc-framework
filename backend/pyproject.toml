[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "vision-kyc"
version = "3.0.0"
description = "Bilingual document intelligence and live-video KYC research pipeline"
requires-python = ">=3.11,<3.13"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"app.nlp" = ["*.json"]
