limit_req_zone $binary_remote_addr zone=kyc_frames:10m rate=12r/s;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    client_body_timeout 30s;
    limit_req_status 429;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        limit_req zone=kyc_frames burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location /health/ { proxy_pass http://backend:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
